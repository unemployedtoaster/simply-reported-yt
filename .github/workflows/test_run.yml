name: 🧪 Test Run — Render & Download Videos

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: "How many news stories to process"
        default: "3"

jobs:
  test:
    name: Render videos (no upload)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 🎬 Install FFmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto fonts-noto-cjk fonts-dejavu-core
          fc-cache -fv

      - name: 📚 Install Python dependencies
        run: pip install -r requirements.txt

      - name: 📁 Create working directories
        run: mkdir -p data/videos assets

      - name: 🧪 Run pipeline in test mode
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m scripts.main \
            --test \
            --max-items ${{ github.event.inputs.max_items || '3' }}

      # ── Save all rendered videos as downloadable artifacts ──────
      - name: 📥 Upload rendered videos for download
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-videos-${{ github.run_number }}
          path: data/videos/
          retention-days: 3   # auto-deleted after 3 days

      - name: 📊 Upload generated scripts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-scripts-${{ github.run_number }}
          path: data/generated_content.json
          retention-days: 3

      - name: 📝 Write summary
        if: always()
        run: |
          echo "## 🧪 Test Run Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 How to download your videos:" >> $GITHUB_STEP_SUMMARY
          echo "1. Scroll down to the **Artifacts** section below" >> $GITHUB_STEP_SUMMARY
          echo "2. Click **rendered-videos-${{ github.run_number }}**" >> $GITHUB_STEP_SUMMARY
          echo "3. A ZIP file will download with all rendered .mp4 files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Each news story has up to 3 video versions:" >> $GITHUB_STEP_SUMMARY
          echo "- \`*_textbg.mp4\` — text on dark background" >> $GITHUB_STEP_SUMMARY
          echo "- \`*_slideshow.mp4\` — news thumbnail + text overlay" >> $GITHUB_STEP_SUMMARY
          echo "- \`*_audiosubs.mp4\` — Bangla voiceover + subtitles" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f data/videos ]; then
            echo "### 🎬 Rendered files:" >> $GITHUB_STEP_SUMMARY
            ls -lh data/videos/*.mp4 2>/dev/null | awk '{print "- "$NF" ("$5")"}' >> $GITHUB_STEP_SUMMARY
          fi
