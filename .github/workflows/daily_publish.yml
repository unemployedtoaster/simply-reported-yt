name: 🇧🇩 Simply Reported — Daily BD News Publisher

on:
  schedule:
    # 6:00 AM Bangladesh time (00:00 UTC) — morning news
    - cron: "0 0 * * *"
    # 12:00 PM Bangladesh time (06:00 UTC) — midday news
    - cron: "0 6 * * *"
    # 6:00 PM Bangladesh time (12:00 UTC) — evening news
    - cron: "0 12 * * *"
    # 11:00 PM Bangladesh time (17:00 UTC) — night news
    - cron: "0 17 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub UI
    inputs:
      max_items:
        description: "Max news items to process"
        default: "10"
      max_uploads:
        description: "Max videos to upload to YouTube"
        default: "5"
      skip_upload:
        description: "Skip YouTube upload (dry run)"
        type: boolean
        default: false

jobs:
  publish:
    name: Fetch → Generate → Render → Upload
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout repo ─────────────────────────────────────────
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ─────────────────────────────────────────
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. Install FFmpeg ─────────────────────────────────────────
      - name: 🎬 Install FFmpeg + Noto Bengali fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto fonts-noto-cjk \
            fonts-dejavu-core libsndfile1
          fc-cache -fv
          ffmpeg -version

      # ── 4. Install Python dependencies ───────────────────────────
      - name: 📚 Install Python dependencies
        run: pip install -r requirements.txt

      # ── 5. Create data directory ──────────────────────────────────
      - name: 📁 Create working directories
        run: mkdir -p data/videos assets

      # ── 6. Run the pipeline ───────────────────────────────────────
      - name: 🚀 Run news pipeline
        env:
          YOUTUBE_API_KEY:            ${{ secrets.YOUTUBE_API_KEY }}
          GROQ_API_KEY:               ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_OAUTH_CREDENTIALS:  ${{ secrets.YOUTUBE_OAUTH_CREDENTIALS }}
        run: |
          MAX_ITEMS=${{ github.event.inputs.max_items || '10' }}
          MAX_UPLOADS=${{ github.event.inputs.max_uploads || '5' }}
          SKIP_UPLOAD=${{ github.event.inputs.skip_upload || 'false' }}

          ARGS="--max-items $MAX_ITEMS --max-uploads $MAX_UPLOADS"
          if [ "$SKIP_UPLOAD" = "true" ]; then
            ARGS="$ARGS --skip-upload"
          fi

          python -m scripts.main $ARGS

      # ── 7. Upload generated data as artifact ─────────────────────
      - name: 📊 Save pipeline artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-data-${{ github.run_number }}
          path: |
            data/news_raw.json
            data/generated_content.json
            data/upload_log.json
          retention-days: 7

      # ── 8. Summary ───────────────────────────────────────────────
      - name: 📝 Write job summary
        if: always()
        run: |
          echo "## 🇧🇩 Simply Reported — Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f data/upload_log.json ]; then
            echo "### ✅ Uploaded Videos" >> $GITHUB_STEP_SUMMARY
            python3 -c "
          import json
          with open('data/upload_log.json') as f:
              log = json.load(f)
          recent = [v for v in log if '$(date -u +%Y-%m-%d)' in v.get('uploaded_at','')]
          for v in recent:
              print(f\"- [{v['title'][:50]}]({v['youtube_url']}) — {v['source']}\")
          " >> $GITHUB_STEP_SUMMARY
          fi
